<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개인정보처리방침</title><h1>더정 우롱티 퀴즈 개인정보처리방침</h1><p>Google 로그인 이메일, 직원명, 퀴즈 기록 및 예측값을 기록 확인과 이벤트 운영에 사용합니다. Google Sheets에 저장하며 운영자가 확인합니다. 참가자 이메일과 응모 내역은 공개하지 않습니다.</p><p>개인정보 확인·정정·삭제 요청은 매장 이벤트 운영 담당자에게 전달해 주세요.</p></html>
